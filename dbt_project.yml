name: 'ecommerce_analytics'
version: '1.0.0'
config-version: 2
profile: 'ecommerce_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

models:
  ecommerce_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      dimensions:
        +materialized: table
        +schema: marts
      facts:
        +materialized: table
        +schema: marts
      metrics:
        +materialized: table
        +schema: metrics
